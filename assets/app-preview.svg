<svg width="880" height="420" viewBox="0 0 880 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .app-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title-font { font-weight: 600; font-size: 13px; fill: #fafafa; }
      .meta-font { font-weight: 400; font-size: 11px; fill: #71717a; }
      .id-font { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="0.5" y="0.5" width="879" height="419" rx="10" fill="#09090b" stroke="#27272a"/>

  <!-- Top App Navigation -->
  <rect x="1" y="1" width="878" height="48" rx="10" fill="#121419" stroke="#1f242d"/>
  <rect x="1" y="38" width="878" height="12" fill="#121419"/>
  <line x1="1" y1="49" x2="879" y2="49" stroke="#27272a"/>

  <!-- Window dots -->
  <circle cx="24" cy="25" r="5" fill="#ef4444"/>
  <circle cx="40" cy="25" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="25" r="5" fill="#10b981"/>

  <!-- Workspace Brand in Top Nav -->
  <circle cx="84" cy="25" r="8" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="100" y="29" class="app-text" font-size="13" font-weight="600" fill="#f4f4f5">Chrono Workspace</text>
  <rect x="226" y="17" width="32" height="16" rx="4" fill="#18181b" stroke="#27272a"/>
  <text x="232" y="29" class="app-text" font-size="9" font-weight="600" fill="#34d399">PRO</text>

  <!-- Nav Tabs -->
  <text x="290" y="29" class="app-text" font-size="12" font-weight="500" fill="#71717a">Projects</text>
  <rect x="345" y="14" width="58" height="22" rx="5" fill="#1e1b4b"/>
  <text x="357" y="29" class="app-text" font-size="12" font-weight="600" fill="#818cf8">Issues</text>
  <text x="420" y="29" class="app-text" font-size="12" font-weight="500" fill="#71717a">Timeline</text>
  <text x="485" y="29" class="app-text" font-size="12" font-weight="500" fill="#71717a">Focus</text>
  <text x="535" y="29" class="app-text" font-size="12" font-weight="500" fill="#71717a">AI Agent</text>

  <!-- Search pill -->
  <rect x="680" y="13" width="180" height="24" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="696" y="29" class="app-text" font-size="11" fill="#71717a">Search issues...</text>
  <rect x="825" y="16" width="28" height="18" rx="3" fill="#27272a"/>
  <text x="830" y="28" class="app-text" font-size="9" font-weight="600" fill="#a1a1aa">⌘K</text>

  <!-- Kanban Column 1: Backlog -->
  <rect x="24" y="65" width="264" height="335" rx="8" fill="#0f1115" stroke="#1f242d"/>
  <circle cx="42" cy="85" r="4" fill="#94a3b8"/>
  <text x="54" y="89" class="app-text" font-size="12" font-weight="600" fill="#e4e4e7">Backlog</text>
  <rect x="256" y="77" width="20" height="16" rx="4" fill="#18181b"/>
  <text x="263" y="89" class="app-text" font-size="10" font-weight="600" fill="#a1a1aa">2</text>

  <!-- Card 1 -->
  <rect x="36" y="105" width="240" height="100" rx="6" fill="#18181b" stroke="#27272a"/>
  <rect x="48" y="117" width="44" height="16" rx="3" fill="#082f49"/>
  <text x="54" y="129" class="id-font" fill="#38bdf8">FIR-4</text>
  <text x="48" y="152" class="app-text title-font">Global Keyboard Listeners</text>
  <text x="48" y="170" class="app-text meta-font">Instant shortcut handling for C and N</text>
  <rect x="48" y="180" width="60" height="16" rx="4" fill="#27272a"/>
  <text x="56" y="192" class="app-text" font-size="9" fill="#a1a1aa">Shortcuts</text>

  <!-- Card 2 -->
  <rect x="36" y="217" width="240" height="100" rx="6" fill="#18181b" stroke="#27272a"/>
  <rect x="48" y="229" width="44" height="16" rx="3" fill="#064e3b"/>
  <text x="54" y="241" class="id-font" fill="#34d399">FIR-5</text>
  <text x="48" y="264" class="app-text title-font">PostgreSQL Realtime Channel</text>
  <text x="48" y="282" class="app-text meta-font">Sync state cache on client mutation</text>
  <rect x="48" y="292" width="60" height="16" rx="4" fill="#064e3b"/>
  <text x="56" y="304" class="app-text" font-size="9" fill="#34d399">Database</text>

  <!-- Kanban Column 2: In Progress -->
  <rect x="308" y="65" width="264" height="335" rx="8" fill="#0f1115" stroke="#1f242d"/>
  <circle cx="326" cy="85" r="4" fill="#f59e0b"/>
  <text x="338" y="89" class="app-text" font-size="12" font-weight="600" fill="#e4e4e7">In Progress</text>
  <rect x="540" y="77" width="20" height="16" rx="4" fill="#18181b"/>
  <text x="547" y="89" class="app-text" font-size="10" font-weight="600" fill="#f59e0b">2</text>

  <!-- Card 3 -->
  <rect x="320" y="105" width="240" height="100" rx="6" fill="#18181b" stroke="#3b82f6"/>
  <rect x="332" y="117" width="44" height="16" rx="3" fill="#1e1b4b"/>
  <text x="338" y="129" class="id-font" fill="#818cf8">FIR-1</text>
  <text x="332" y="152" class="app-text title-font">Command Palette Modal</text>
  <text x="332" y="170" class="app-text meta-font">Fuzzy action query with Cmd+K hook</text>
  <rect x="332" y="180" width="56" height="16" rx="4" fill="#1e1b4b"/>
  <text x="340" y="192" class="app-text" font-size="9" fill="#818cf8">Frontend</text>
  <rect x="394" y="180" width="28" height="16" rx="4" fill="#27272a"/>
  <text x="402" y="192" class="app-text" font-size="9" fill="#f59e0b">3 pt</text>

  <!-- Card 4 -->
  <rect x="320" y="217" width="240" height="100" rx="6" fill="#18181b" stroke="#a855f7"/>
  <rect x="332" y="229" width="44" height="16" rx="3" fill="#2e1065"/>
  <text x="338" y="241" class="id-font" fill="#c084fc">FIR-3</text>
  <text x="332" y="264" class="app-text title-font">Chrono AI Reasoning Engine</text>
  <text x="332" y="282" class="app-text meta-font">Multi-turn backlog analysis with tool use</text>
  <rect x="332" y="292" width="62" height="16" rx="4" fill="#2e1065"/>
  <text x="340" y="304" class="app-text" font-size="9" fill="#c084fc">AI Agent</text>
  <rect x="400" y="292" width="28" height="16" rx="4" fill="#27272a"/>
  <text x="408" y="304" class="app-text" font-size="9" fill="#ef4444">Urgent</text>

  <!-- Kanban Column 3: Done -->
  <rect x="592" y="65" width="264" height="335" rx="8" fill="#0f1115" stroke="#1f242d"/>
  <circle cx="610" cy="85" r="4" fill="#10b981"/>
  <text x="622" y="89" class="app-text" font-size="12" font-weight="600" fill="#e4e4e7">Done</text>
  <rect x="824" y="77" width="20" height="16" rx="4" fill="#18181b"/>
  <text x="831" y="89" class="app-text" font-size="10" font-weight="600" fill="#10b981">1</text>

  <!-- Card 5 -->
  <rect x="604" y="105" width="240" height="100" rx="6" fill="#18181b" stroke="#10b981"/>
  <rect x="616" y="117" width="44" height="16" rx="3" fill="#064e3b"/>
  <text x="622" y="129" class="id-font" fill="#34d399">FIR-2</text>
  <text x="616" y="152" class="app-text title-font">Row Level Security Policies</text>
  <text x="616" y="170" class="app-text meta-font">Tenant boundary verification on all tables</text>
  <rect x="616" y="180" width="54" height="16" rx="4" fill="#064e3b"/>
  <text x="624" y="192" class="app-text" font-size="9" fill="#34d399">Security</text>
  <rect x="676" y="180" width="52" height="16" rx="4" fill="#14532d"/>
  <text x="684" y="192" class="app-text" font-size="9" fill="#4ade80">Verified</text>
</svg>
